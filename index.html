<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Coding Bootcamp Testimonials Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="main">
      <div class="container">
        <div class="text-box">
          <p class="main-testimonial"></p>
          <p class="name-and-job">
            <span class="name"></span><span class="job"></span>
          </p>
        </div>

        <div class="img-box">
          <img src="" alt="" class="testimonial-img" />
        </div>

        <div class="arrow">
          <button class="prev" onclick="updateSlider()">
            <img src="./images/icon-prev.svg" alt="previous arrow" class="arrow-img" />
          </button>
          <button class="next" onclick="updateSlider()">
            <img src="./images/icon-next.svg" alt="next arrow" class="arrow-img" />
          </button>
        </div>
      </div>
      <!-- container ends-->
    </main>
  </body>
</html>
